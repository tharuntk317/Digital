<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Creator — Creators Marketplace</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>@keyframes fade-up{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}.anim-fade-up{animation:fade-up 320ms ease-out both}</style>
</head>
<body class="bg-white text-slate-800">

  <header class="border-b">
    <div class="max-w-6xl mx-auto px-6 py-4 flex items-center justify-between">
      <a href="index.html" class="text-xl font-bold">Creators Marketplace</a>
      <nav class="flex items-center gap-4"><a href="explore.html" class="hover:underline">Explore</a></nav>
    </div>
  </header>

  <main class="max-w-6xl mx-auto px-6 py-10">
    <div id="profileWrap" class="anim-fade-up">
      <!-- injected by JS -->
    </div>
  </main>

  <footer class="border-t mt-12"><div class="max-w-6xl mx-auto px-6 py-6 text-sm text-slate-500">© Creators Marketplace — 2025</div></footer>

  <script src="assets/site.js"></script>
  <script>
    // minimal creator info
    const creators = {
      'aiko': {
        name: 'AikoArt',
        title: 'Anime-focused illustrator',
        bio: 'I create character packs, backgrounds and commission portraits. My work emphasizes clean linework and vibrant palettes suitable for games and comics.',
        products: [
          { id: 'anime-pack-50', title: 'Anime Character Pack — 50 HD Illustrations', price: 499 },
          { id: 'chibi-set', title: 'Chibi Emotes Pack — 30 PNG', price: 199 }
        ],
        socials: { insta: 'https://instagram.com/aikoart' }
      },
      'wavemaker': {
        name: 'WaveMaker',
        title: 'Music Producer',
        bio: 'Composer & producer focused on ambient and cinematic soundscapes for media creators.',
        products: [
          { id: 'ambient-loops-20', title: 'Ambient Production Pack — 20 Loops', price: 699 }
        ]
      }
    };

    function getParam(name){ return new URLSearchParams(location.search).get(name); }
    const username = (getParam('user') || 'aiko').toLowerCase();
    const c = creators[username] || creators['aiko'];

    const wrap = document.getElementById('profileWrap');
    wrap.innerHTML = `
      <div class="grid lg:grid-cols-3 gap-8">
        <div class="lg:col-span-2">
          <div class="rounded-lg border p-6">
            <h1 class="text-2xl font-semibold">${c.name}</h1>
            <div class="text-sm text-slate-600 mt-1">${c.title}</div>
            <p class="mt-4 text-slate-700">${c.bio}</p>

            <section class="mt-6">
              <h3 class="font-semibold">Products by ${c.name}</h3>
              <div class="mt-3 grid sm:grid-cols-2 gap-4">
                ${c.products.map(prod => `
                  <div class="p-3 border rounded">
                    <h4 class="font-medium">${prod.title}</h4>
                    <div class="mt-2 flex items-center justify-between">
                      <div class="text-sm text-slate-600">Price: ₹${prod.price}</div>
                      <div><a href="product.html?id=${encodeURIComponent(prod.id)}" class="text-indigo-600 hover:underline text-sm">View</a></div>
                    </div>
                  </div>`).join('')}
              </div>
            </section>
          </div>
        </div>

        <aside class="p-4 border rounded">
          <div class="text-sm">Followers <div class="font-semibold mt-1">3,482</div></div>
          <div class="mt-4">
            <a href="${c.socials?.insta || '#'}" target="_blank" class="inline-block px-3 py-1 border rounded text-sm">Follow</a>
          </div>
        </aside>
      </div>
    `;
  </script>
</body>
</html>
