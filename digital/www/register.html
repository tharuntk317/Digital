<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Create Account - CreatorsHub</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Poppins', sans-serif; }
  </style>
</head>
<body class="bg-black text-gray-100">

  <!-- Navbar -->
 <!-- Navbar -->
<nav class="bg-gradient-to-r from-purple-700 to-pink-600 shadow-lg sticky top-0 z-50">
  <div class="max-w-7xl mx-auto px-6 flex items-center justify-between h-16">
    <!-- Logo -->
    <a href="index.html" class="text-2xl font-bold text-white tracking-wide">Creators<span class="text-pink-300">Hub</span></a>

    <!-- Hamburger for mobile -->
    <div class="md:hidden">
      <button id="menu-btn" class="text-white focus:outline-none">
        <svg class="w-6 h-6" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"
          stroke-linecap="round" stroke-linejoin="round">
          <path d="M4 6h16M4 12h16M4 18h16"></path>
        </svg>
      </button>
    </div>

    <!-- Desktop Menu -->
    <div id="menu" class="hidden md:flex gap-6 items-center text-sm font-medium">
      <a href="explore.html" class="text-gray-200 hover:text-white">Explore</a>
      <a href="login.html" class="text-gray-200 hover:text-white">Login</a>
      <a href="cart.html"
        class="px-4 py-2 border border-white rounded hover:bg-white hover:text-purple-700 transition">Cart</a>
    </div>
  </div>
</nav>

<!-- Mobile Menu -->
<div id="mobile-menu" class="hidden md:hidden bg-gradient-to-r from-purple-700 to-pink-600 px-6">
  <a href="explore.html" class="block py-3 text-white border-b border-purple-500">Explore</a>
  <a href="login.html" class="block py-3 text-white border-b border-purple-500">Login</a>
  <a href="cart.html" class="block py-3 text-white">Cart</a>
</div>

<script>
  const btn = document.getElementById('menu-btn');
  const mobileMenu = document.getElementById('mobile-menu');

  btn.addEventListener('click', () => {
    mobileMenu.classList.toggle('hidden');
  });
</script>


  <!-- Registration Section -->
  <section class="max-w-4xl mx-auto px-6 py-20 flex flex-col md:flex-row items-center gap-12">

    <!-- Left Side / Info -->
    <div class="md:w-1/2 text-center md:text-left">
      <h1 class="text-4xl font-bold text-white mb-4">Join CreatorsHub</h1>
      <p class="text-gray-300 mb-6">Create your account to explore, buy, and save digital products from top creators worldwide.</p>
      <p class="text-gray-400">Already have an account? <a href="login.html" class="text-pink-400 hover:underline">Login here</a></p>
    </div>

    <!-- Right Side / Form -->
    <div class="md:w-1/2 bg-gray-900 border border-purple-500 rounded p-8 shadow-lg">
      <h2 class="text-2xl font-semibold text-purple-300 mb-6 text-center">Create Account</h2>
      <form class="space-y-6">
        <div>
          <label class="block mb-2 text-gray-300">Full Name</label>
          <input type="text" placeholder="Your Name" class="w-full p-3 rounded bg-black border border-purple-500 text-white focus:outline-none focus:ring-2 focus:ring-pink-400">
        </div>
        <div>
          <label class="block mb-2 text-gray-300">Email</label>
          <input type="email" placeholder="you@email.com" class="w-full p-3 rounded bg-black border border-pink-500 text-white focus:outline-none focus:ring-2 focus:ring-purple-400">
        </div>
        <div>
          <label class="block mb-2 text-gray-300">Password</label>
          <input type="password" placeholder="********" class="w-full p-3 rounded bg-black border border-purple-500 text-white focus:outline-none focus:ring-2 focus:ring-pink-400">
        </div>
        <div>
          <label class="block mb-2 text-gray-300">Confirm Password</label>
          <input type="password" placeholder="********" class="w-full p-3 rounded bg-black border border-purple-500 text-white focus:outline-none focus:ring-2 focus:ring-pink-400">
        </div>
        <div class="flex items-center gap-2 text-gray-300 text-sm">
          <input type="checkbox" class="accent-pink-400"> I agree to the <a href="#" class="text-purple-400 hover:underline">Terms & Conditions</a>
        </div>
        <button class="w-full px-6 py-3 bg-gradient-to-r from-purple-500 to-pink-500 text-white font-semibold rounded hover:opacity-90">Create Account</button>
      </form>
    </div>
  </section>

  <!-- Footer -->
  <footer class="border-t border-purple-500 bg-black py-10 text-center text-sm text-gray-500">
    <p>© 2025 CreatorsHub. All rights reserved.</p>
  </footer>

</body>
</html>
