<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>404 - Page Not Found</title>
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- Custom Styles -->
  <link href="https://fonts.googleapis.com/css2?family=Poppins&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Poppins', sans-serif;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      background-color: #000;
      color: #fff;
      text-align: center;
      padding: 2rem;
    }

    .fade-in { animation: fadeIn 1.2s ease-in-out forwards; opacity: 0; }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .glow {
      text-shadow: 0 0 10px #3b82f6, 0 0 20px #60a5fa, 0 0 30px #93c5fd;
    }

    .neon-button {
      position: relative;
      display: inline-block;
      padding: 0.75rem 2rem;
      border-radius: 9999px;
      font-weight: 600;
      background: linear-gradient(to right, #8b5cf6, #ec4899);
      color: #fff;
      text-decoration: none;
      box-shadow: 0 0 10px #8b5cf6, 0 0 20px #ec4899;
      transition: all 0.3s ease;
    }

    .neon-button:hover {
      box-shadow: 0 0 20px #8b5cf6, 0 0 40px #ec4899, 0 0 60px #f472b6;
      transform: scale(1.05);
    }
  </style>
</head>
<body>

  <div class="fade-in">
    <h1 class="text-[8rem] font-extrabold glow">404</h1>
    <h2 class="text-3xl md:text-4xl font-bold mt-4 glow">Oops! Page Not Found</h2>
    <p class="text-gray-400 mt-2 mb-6">The page you are looking for does not exist or has been moved.</p>
    <a href="/" class="neon-button">Go Back Home</a>
  </div>

</body>
</html>
