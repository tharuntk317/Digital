<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Products</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Poppins&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Poppins', sans-serif; }
    .fade-in { animation: fadeIn 1.2s ease-in-out forwards; opacity: 0; }
    @keyframes fadeIn { from {opacity:0;transform:translateY(10px);} to {opacity:1;transform:translateY(0);} }
    .glow { text-shadow: 0 0 8px #3b82f6, 0 0 15px #60a5fa; }
  </style>
</head>
<body class="bg-black text-white p-6">

  <h1 class="text-3xl font-bold text-center mb-5 glow fade-in">Our Products</h1>

  <!-- 🔹 Small Compact Search Bar -->
  <div class="max-w-sm mx-auto mb-8 fade-in">
    <div class="flex items-center bg-gray-900 border border-gray-700 rounded-full px-3 py-1 shadow-md">
      <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24"
           stroke-width="1.5" stroke="gray" class="w-5 h-5 mr-2">
        <path stroke-linecap="round" stroke-linejoin="round"
              d="M21 21l-4.35-4.35m0 0A7.5 7.5 0 104.5 4.5a7.5 7.5 0 0012.15 12.15z" />
      </svg>
      <input id="searchInput" type="text" placeholder="Search..."
        class="bg-transparent w-full text-sm text-white outline-none placeholder-gray-400">
    </div>
  </div>

  <!-- 🔹 Product Grid -->
  <div id="productGrid" class="grid gap-6 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 max-w-7xl mx-auto">
    {% for doc in products %}
      <a href="/product/{{ doc.name }}" 
         class="product-card bg-gray-900 rounded-xl shadow-lg hover:shadow-blue-500/50 transition overflow-hidden block group fade-in"
         data-category="{{ doc.category }}"
         data-price="{{ doc.price }}"
         data-tags="{{ doc.tags }}">
        
        <div class="relative w-full h-44 overflow-hidden">
          <img src="{{ doc.preview_image }}" alt="{{ doc.title }}" 
               class="w-full h-full object-cover group-hover:scale-105 transition-transform duration-300">
        </div>

        <div class="p-3 flex flex-col gap-2">
          <h3 class="text-base font-semibold text-white line-clamp-1">{{ doc.title }}</h3>

          <div class="flex flex-wrap gap-2 text-xs text-gray-400">
            {% if doc.category %}<span class="bg-gray-800 px-2 py-0.5 rounded-full">{{ doc.category }}</span>{% endif %}
            {% if doc.tags %}<span class="bg-gray-800 px-2 py-0.5 rounded-full">{{ doc.tags }}</span>{% endif %}
          </div>

          <p class="text-white font-semibold text-sm mt-1">₹ {{ doc.price }}</p>

          <div class="flex items-center mt-2 gap-2">
            <img src="{{ creator_logo }}" alt="Creator Logo" 
                 class="h-6 w-6 rounded-full object-cover border border-gray-700">
            <span class="text-gray-300 text-xs">{{ doc.creator }}</span>
          </div>
        </div>
      </a>
    {% endfor %}
  </div>

  <!-- 🔹 Smart Search Logic -->
  <script>
    const searchInput = document.getElementById('searchInput');
    const products = document.querySelectorAll('.product-card');

    searchInput.addEventListener('input', () => {
      const q = searchInput.value.toLowerCase();
      products.forEach(p => {
        const name = p.querySelector('h3').textContent.toLowerCase();
        const category = (p.dataset.category || '').toLowerCase();
        const tags = (p.dataset.tags || '').toLowerCase();
        const price = parseFloat(p.dataset.price || 0);
        const matches = name.includes(q) || category.includes(q) || tags.includes(q) || (!isNaN(q) && price <= parseFloat(q));
        p.style.display = matches ? 'block' : 'none';
      });
    });
  </script>

</body>
</html>
