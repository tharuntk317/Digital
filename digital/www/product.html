<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{ doc.title }}</title>
  <script src="https://cdn.tailwindcss.com"></script>
  
 
  <link href="https://fonts.googleapis.com/css2?family=Poppins&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Poppins', sans-serif; }
    
  
    .fade-in { animation: fadeIn 1.2s ease-in-out forwards; opacity: 0; }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .glow {
      text-shadow: 0 0 10px #3b82f6, 0 0 20px #60a5fa;
    }
  </style>
</head>
<body class="bg-black text-white min-h-screen flex flex-col items-center p-6">

  <div class="bg-gray-900 rounded-xl shadow-lg max-w-lg w-full p-6 fade-in">
    

    <img src="{{ doc.preview_image }}"
         alt="{{ doc.title }}"
         class="w-full h-60 object-cover rounded-lg mb-4">

   
    <div class="flex items-center gap-3 mb-4">
      <a href="/page">
        <img src="{{ creator_logo  }}"
             alt="{{ doc.name }} Logo"
             class="h-12 w-12 rounded-full object-cover border border-gray-700">
      </a>
      <h2 class="text-2xl font-bold glow">{{ doc.title }}</h2>
    </div>

    <p class="text-gray-300 mb-2 text-lg">₹ {{ doc.price }}</p>
    <p class="text-gray-400 mb-4">{{ doc.description }}</p>

    <div class="flex flex-wrap gap-2 mb-4 items-center">
      <span class="text-gray-300 text-sm">{{ doc.creator }}</span>
      {% if doc.tags %}
        <span class="bg-gray-800 px-2 py-1 rounded-full text-sm">{{ doc.tags }}</span>
      {% endif %}
      {% if doc.category %}
        <span class="bg-gray-800 px-2 py-1 rounded-full text-sm">{{ doc.category }}</span>
      {% endif %}
      {% if doc.download_count %}
        <span class="bg-gray-800 px-2 py-1 rounded-full text-sm">Downloads: {{ doc.download_count }}</span>
      {% endif %}
    </div>

    <a href="/payment-page/new?product_id={{ doc.name }}&product_price={{ doc.price }}"
       class="relative inline-block px-6 py-3 rounded-lg text-white font-semibold transition-all
              bg-gradient-to-r from-pink-600 to-purple-600
              shadow-lg hover:shadow-[0_0_20px_#f472b6,0_0_30px_#8b5cf6]
              hover:from-pink-700 hover:to-purple-700
              before:absolute before:inset-0 before:rounded-lg before:bg-gradient-to-r before:from-pink-600 before:to-purple-600 before:blur-xl before:opacity-0 hover:before:opacity-60 before:transition-opacity">
      Buy Now
    </a>

  </div>
<!-- <a href="/app/buyer-payment/new-buyer-payment?product_id={{ doc.name }}&product_price={{ doc.price }}" -->
<script src="http://localhost:8001/assets/digital/js/pay.js"></script>

</body>
</html>
